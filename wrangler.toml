name = "tavily-cf-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# KV namespace for all application data (tavily keys, distributed keys, stats).
# Run `pnpm kv:create -- <PREFIX>` or `wrangler kv namespace create <PREFIX>`
# to provision, then paste the generated id below.
[[kv_namespaces]]
binding = "KV"
id = "ff56ea82daa846538fdf11e6bff662eb"

# 对外 API 地址 PUBLIC_BASE_URL 是普通变量（非 secret）：生产经 scripts/deploy.sh 从
# gitignored 的 config/prod.env 以 `--var PUBLIC_BASE_URL:https://…` 注入（注意 --var 用冒号分隔）；
# 本地开发在 .dev.vars 覆盖。唯一取值见 src/config.ts。

[observability.logs]
enabled = true
invocation_logs = true
