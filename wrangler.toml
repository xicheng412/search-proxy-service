name = "tavily-cf-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# KV namespace：基础配置（breaker_config / queue_config）与登录会话仍留 KV。
[[kv_namespaces]]
binding = "KV"
id = "ff56ea82daa846538fdf11e6bff662eb"

# D1 数据库：实体数据（上游/分发 key、用量小时桶、熔断状态）迁到 SQLite。
[[d1_databases]]
binding = "DB"
database_name = "search-proxy"
database_id = "2bc00217-ccb0-44c0-a1aa-138fc2ca400e"
migrations_dir = "migrations"

# 每 provider 一把队列 Durable Object（idFromName(provider) = "tavily"|"exa"）。
# 串行放行上游请求（intervalMs 间隔 + maxDepth 拒入），参数运行时经 KV `queue_config` 调整。
[[durable_objects.bindings]]
name = "QUEUE"
class_name = "QueueDO"

# 新式 DO 声明（wrangler 4.x）：提供 sqlite 存储的 durable-object 导出。
# 注意：migrations 与 exports 互斥，只用 exports（对应旧式 [[migrations]] v1-queue 迁移已完成）。
[exports.QueueDO]
type = "durable-object"
storage = "sqlite"

# 用量保留清理：每天 UTC 03:00 删除超保留期的 usage_counts 小时桶。
[triggers]
crons = ["0 3 * * *"]

# 对外 API 地址 PUBLIC_BASE_URL 是普通变量（非 secret）：生产经 scripts/deploy.sh 从
# gitignored 的 config/prod.env 以 `--var PUBLIC_BASE_URL:https://…` 注入（注意 --var 用冒号分隔）；
# 本地开发在 .dev.vars 覆盖。唯一取值见 src/config.ts。

# 远端不再记录 Workers Logs（关闭 Cloudflare 日志平台采集，节省成本/避免记录内容）。
# 本地 pnpm dev 的终端日志不受影响（那是运行时输出，非远端采集）。
[observability.logs]
enabled = false
invocation_logs = false
